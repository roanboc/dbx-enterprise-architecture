# The deployment bundle: the same application as a Databricks App, its store a
# schema in a Lakebase database (Postgres) this bundle creates.
#
#   make deploy          # validate and deploy: the database instance and the app, not yet running
#   make deploy-run      # start the app
#
# What the platform injects at run time (DATABRICKS_HOST, the app's service
# principal, DATABRICKS_APP_PORT) is never set here; what the bundle owns is
# set from its resources, so the app follows the names the target deploys —
# development mode prefixes what it creates with the deployer's name, and
# `databricks bundle summary -t dev` prints them. The app's database resource
# gives its service principal a Postgres role that may connect to the database
# and create in it, which is all the store needs: it creates its schema on the
# first start. The engine looks the instance's host up through the SDK and
# signs in with a token it generates, so no host, user or password is set.
bundle:
  name: ea-repository

variables:
  instance:
    description: The Lakebase database instance that holds the store; this bundle creates it.
    default: ea-repository
  capacity:
    description: The instance's compute size (CU_1, CU_2, CU_4, CU_8); the smallest holds the whole model.
    default: CU_1
  database:
    description: The Postgres database inside the instance; every instance is created with this one.
    default: databricks_postgres
  schema:
    description: The schema the store's tables live in; the app creates it on its first start.
    default: ea
  role_groups:
    description: Which workspace groups grant which role (decision 0008); nobody listed is a Reader.
    default: "admin=ea-admins;architect=ea-architects;reviewer=ea-reviewers"
  agent_provider:
    description: "auto: a hosted model when its key is bound as a secret, the stub otherwise."
    default: auto

resources:
  database_instances:
    ea:
      name: ${var.instance}
      capacity: ${var.capacity}

  apps:
    ea_repository:
      name: ea-repository
      description: "A generic, metamodel-driven enterprise architecture repository."
      source_code_path: .
      # The forwarded token lets the app read the signed-in user's own workspace groups;
      # without it the app's service principal reads them instead.
      user_api_scopes:
        - iam.current-user:read
      config:
        # uv-based apps get no pre-installed libraries: every dependency comes from
        # pyproject.toml + uv.lock. --frozen uses the lock verbatim, --no-dev leaves
        # pytest and ruff out, --extra databricks adds the SDK that signs the app in
        # to its instance and reads the workspace groups.
        command:
          - uv
          - run
          - --frozen
          - --no-dev
          - --extra
          - databricks
          - python
          - app.py
        env:
          - name: EA_BACKEND
            value: lakebase
          - name: EA_LAKEBASE_INSTANCE
            value: ${resources.database_instances.ea.name}
          - name: PGDATABASE
            value: ${var.database}
          - name: EA_SCHEMA
            value: ${var.schema}
          - name: EA_PACK
            value: packs/higher_education/metamodel.yaml
          - name: EA_AUTH
            value: databricks
          - name: EA_ROLE_GROUPS
            value: ${var.role_groups}
          - name: EA_AGENT_PROVIDER
            value: ${var.agent_provider}
      resources:
        - name: database
          database:
            instance_name: ${resources.database_instances.ea.name}
            database_name: ${var.database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    variables:
      instance: ea-repository-prod
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
