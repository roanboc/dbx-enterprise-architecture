    type_owner: Repository administrator
    instance_owner: Portfolio Domain Architects

  - id: capability
    name: Capability
    plural: Capabilities
    domain: enterprise
    notation: {layer: strategy, glyph: '✦', stereotype: Capability, archimate: Capability, shape: rect}
    provenance: TOGAF
    prefix: CAP
