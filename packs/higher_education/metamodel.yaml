    plural: Business Definitions
    supertype: business_information
    domain: information
    notation: {layer: business, glyph: '▤', stereotype: Business Object, archimate: BusinessObject, shape: rect}
    provenance: LOCAL
    prefix: DEF
    description: A sub-type of Business Information. An entry in a business glossary; the definition of a business term.
    examples: [Enrolled Student, Sessional Academic, Award Course]
    source_of_record: Not yet loaded; the EA repository is planned to become the primary source, with definitions entered by business term owners
    type_owner: Information Domain Architect
    instance_owner: Portfolio Domain Architects
    attributes:
