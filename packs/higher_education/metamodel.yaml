# Higher Education EA Metamodel: a university's TOGAF-based enterprise architecture
# metamodel, anonymised, expressed as a metamodel pack for the EA repository engine.
# It is the first worked pack; the institution it came from is not named.
#
# Everything here is data. Nothing in the engine knows the names below; a
# different framework (ArchiMate, TOGAF content metamodel, a home-grown one)
# is another pack with the same shape. The schema of a pack is documented in
# packs/README.md.
#
# Provenance of a type follows the source metamodel's own tags: TOGAF (from the
# TOGAF content metamodel), CORE_EA (from the previous tool's core metamodel),
# LOCAL (the institution's own additions and sub-types).

pack:
  # Opaque and permanent (decision 0021): minted once, carried by this file, and never
  # recomputed — so the name below is free to change and a store that already held this
  # framework as `higher_education` is brought forward onto the same key rather than forking it.
  id: mm_9mqjcx2s4h8y5cx0
  name: Higher Education EA Metamodel
  version: "2026-08-11"
  status: published
  description: >-
    The object types and relationships that appear in a university's enterprise
    architecture models, giving a consistent shared language for architectural
    work. Active types are those in use; inactive types are kept so that content
    exported from a previous repository can be imported and flagged rather than
    dropped.
  source: A university's TOGAF-based metamodel document (held privately), anonymised
  provenance_values: [TOGAF, CORE_EA, LOCAL]

# Domains group the element types the way the source metamodel's diagrams do.
domains:
  - id: information
    name: Information
    description: Business information, its logical categorisation and its physical encapsulation; owned by the Information Domain Architect.
    notation: {colour: blue, hex: '#4dabf7', layer: application, glyph: '▤', stereotype: Data Object, archimate: DataObject, shape: rect}
  - id: process
    name: Process
    description: Actors, roles, processes and value streams; owned by the Process Domain Architect.
    notation: {colour: pink, hex: '#f783ac', layer: business, glyph: '⚙', stereotype: Business Process, archimate: BusinessProcess, shape: round}
  - id: integration
    name: Integration
    description: Applications, technology, integrations and interfaces; owned by the Technology Domain Architect.
    notation: {colour: yellow, hex: '#ffd43b', layer: application, glyph: '▭', stereotype: Application Component, archimate: ApplicationComponent, shape: rect}
  - id: enterprise
    name: Objects of enterprise concern
    description: Strategy, portfolio and organisation objects that do not fall into a single architect's domain but are of global concern.
    notation: {colour: gray, hex: '#adb5bd', layer: strategy, glyph: '✦', stereotype: Capability, archimate: Capability, shape: rect}

# The sections an element's attributes are read and edited in, in this order. An attribute
# names one of these by its identifier; the metamodel screen offers the list rather than a
# text box, so a typo cannot make a section of its own.
attribute_groups:
  - {id: identification, name: Identification, description: What the element is called and where it came from.}
  - {id: governance, name: Governance, description: Who owns it and how far it has been approved.}
  - {id: classification, name: Classification, description: The categories and standards it is filed under.}
  - {id: standard_dates, name: Standard dates, description: 'When the standard was created, reviewed and retired.'}
  - {id: data_platform, name: Data platform, description: What the analytics platform holds about it.}
  - {id: risk_ratings, name: Risk ratings, description: 'Confidentiality, integrity and availability ratings.'}

# Attributes every element may carry in addition to the core fields
# (name, description, status, lifecycle_status, key, source_system, links).
# They come from the export of the current repository. `group` is the section of the
# source metamodel's own document the attribute is listed under; the application reads
# an element's attributes in those groups, on the form and on the page that only reads.
common_attributes:
  - {name: alias, group: identification, label: Alias, type: string}
  - {name: architectural_status, group: governance, label: Architectural Status, type: string}
  - {name: approval_status, group: governance, label: Approval Status, type: string, enum: [Approved, Not Approved]}
  - {name: version_flag, group: governance, label: Version Flag, type: string}
  - {name: source, group: identification, label: Source, type: string, description: 'Where the element was sourced from, e.g. a reference data model, the CMDB product catalogue.'}
  - {name: owner, group: governance, label: Owner, type: string}
  - {name: categories, group: classification, label: Categories, type: string}
  - {name: category_general, group: classification, label: Category (General), type: string}
  - {name: standards_class, group: classification, label: Standards Class, type: string}
  - {name: standard_creation_date, group: standard_dates, label: Standard Creation Date, type: date}
  - {name: last_standard_review_date, group: standard_dates, label: Last Standard Review Date, type: date}
  - {name: next_standard_review_date, group: standard_dates, label: Next Standard Review Date, type: date}
  - {name: standard_retire_date, group: standard_dates, label: Standard Retire Date, type: date}

element_types:
