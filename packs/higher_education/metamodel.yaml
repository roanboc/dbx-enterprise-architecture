    plural: Benefits
    domain: enterprise
    notation: {layer: motivation, glyph: '◎', stereotype: Outcome, archimate: Outcome, shape: round}
    provenance: CORE_EA
    prefix: BEN
    description: A measurable advantage or positive outcome that an organization expects to achieve through the realisation of an architectural component or a business initiative. Benefits are typically aligned with strategic goals and justify investment in architectural change.
    examples: [Improved Student Retention, Enhanced Operational Efficiency, Increased Research Output]
    source_of_record: The project portfolio tool
    type_owner: Repository administrator
    instance_owner: Portfolio Domain Architects

  - id: business_definition
