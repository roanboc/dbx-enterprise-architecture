# ---------------------------------------------------------------- viewpoints
# What a diagram is for (decision 0023). The reader picks one when a view is exported: it
# says which element types and relationship types the drawing admits (none named: every one),
# how the drawing is banded, which relationship types draw one shape inside another (the whole
# holds the part) and which draw the target as a bar across the sources related to it. The
# four here mirror the ArchiMate 3.2 example viewpoints the metamodel's own diagrams fall
# under; each is a first cut for the framework owner to correct.
viewpoints:
  - id: layered
    name: Layered
    description: >-
      Every element the view holds, in a band per architecture layer; the hierarchies of
      capabilities, organisation units and processes, and the data entities a logical data
      component encapsulates, drawn as nesting.
    nest: [capability__contains__capability, organization_unit__contains__organization_unit, process__contains__process,
           logical_data_component__constitutes__logical_data_component, logical_data_component__encapsulates__data_entity]
  - id: application_cooperation
    name: Application cooperation
    description: >-
      Applications, their interfaces and integrations, and the data they process, in a band per
      type; a data entity drawn inside the logical data component that encapsulates it.
    element_types: [logical_application_component, physical_application_component, interface, integration,
                    logical_data_component, data_entity, physical_technology_component, logical_technology_component]
    bands: type
    band_order: [logical_application_component, physical_application_component, interface, integration,
                 logical_data_component, data_entity, physical_technology_component, logical_technology_component]
    nest: [logical_data_component__encapsulates__data_entity]
  - id: process_cooperation
    name: Process cooperation
    description: >-
      Processes in a swimlane per role that performs them, with the actors, organisation units,
      capabilities, value streams, information assets and applications around them; a process
      drawn inside the process that contains it.
    element_types: [process, role, actor, organization_unit, capability, value_stream, information_asset,
                    physical_application_component]
    bands: related
    band_type: role
    band_relationships: [role__performs__process]
    other_band: Not performed by a role
    nest: [process__contains__process]
  - id: staged_delivery
    name: Staged delivery
    description: >-
      A band per capability, holding the applications, integrations and processes that realise
      it; a data entity spans the applications that process it, and a data product spans the
      data entities that contribute to it.
    element_types: [capability, process, physical_application_component, integration, data_entity, data_product,
                    information_asset]
    bands: related
    band_type: capability
    band_relationships: [process__realises__capability, physical_application_component__realises__capability,
                         integration__supports__capability, information_asset__relates_to__capability]
    other_band: Data
    span: [physical_application_component__processes__data_entity, data_entity__contributes_to__data_product]
