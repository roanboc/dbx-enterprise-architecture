    prefix: BSVC
    description: An element of behavior that provides specific functionality in response to requests from actors or other services. A service delivers or supports business capabilities, has an explicitly defined interface, and is explicitly governed.
    examples: [Student Enrollment Service, Course Management Service, Research Grant Management Service]
