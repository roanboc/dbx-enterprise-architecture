    prefix: ACT
    description: A person, organization, or system that has a role that initiates or interacts with activities. A key component of the Process Domain metamodel.
    examples: [Faculty Member, Solution Architect, Non-Award Student]
    source_of_record: Not yet loaded; future source is the process modelling tool selected by the Process Architecture CoE
    type_owner: Process Domain Architect
    instance_owner: Portfolio Domain Architects

