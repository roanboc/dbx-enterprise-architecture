[project]
name = "ea-repository"
version = "0.1.0"
description = "Generic, metamodel-driven enterprise architecture repository on DuckDB and Databricks"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "networkx>=3.3",
    "dash>=3.0",
    "dash-mantine-components>=1.0",
    "dash-ag-grid>=31.3",
    "dash-cytoscape>=1.0",
    "gunicorn>=23.0",
    "python-dotenv>=1.0",
    "markdown>=3.6",
    "anthropic>=0.60",
    "typer>=0.12",
]

[project.optional-dependencies]
databricks = ["databricks-sql-connector>=4.0", "databricks-sdk>=0.40"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]
# The browser-driven round, installed on request with `uv sync --group gui`.
# Pinned: the driver and the browser build ship as a pair, so a bump is a
# bump of both, together with `playwright install chromium`.
gui = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.56,<1.57",
]

[project.scripts]
ea = "ea.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -m 'not gui'"
markers = [
    "gui: drives the running application in a browser (make gui)",
    "cli: drives the command line against a database of its own (make check and make gui)",
    "scenario(scenario_id, group, title, expected, ...): what this test proves, for the report",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# scripts/ holds archreator's validators verbatim, so they can be refreshed from upstream.
extend-exclude = ["scripts"]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/ea/cli.py" = ["B008"]
